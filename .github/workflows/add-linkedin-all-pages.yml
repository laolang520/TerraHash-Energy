name: Add LinkedIn Footer Link To All Pages

on:
  push:
    paths:
      - '.github/workflows/add-linkedin-all-pages.yml'

permissions:
  contents: write

jobs:
  add-linkedin-all-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add LinkedIn icon to all website footers
        shell: python
        run: |
          from pathlib import Path

          linkedin_url = "https://www.linkedin.com/company/terrahash-energy/"
          icon = '''<a href="https://www.linkedin.com/company/terrahash-energy/" target="_blank" rel="noopener noreferrer" aria-label="TerraHash Energy on LinkedIn" class="footer-linkedin"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V8.98h3.42v1.57h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.29ZM5.32 7.41a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.1 20.45H3.54V8.98H7.1v11.47Z"/></svg></a>'''

          # Official public website pages only; preview/demo files are intentionally excluded.
          pages = [
              "index.html",
              "about.html",
              "solutions.html",
              "digital-assets.html",
              "ecosystem.html",
              "market-intelligence.html",
              "investor-relations.html",
              "news.html",
              "contact.html",
              "careers.html",
              "careers-cdo.html",
              "careers-cgo.html",
              "careers-coo.html",
          ]

          changed = []
          skipped = []
          for filename in pages:
              path = Path(filename)
              if not path.exists():
                  skipped.append(f"{filename}: missing")
                  continue
              text = path.read_text(encoding="utf-8")
              if linkedin_url in text:
                  skipped.append(f"{filename}: already linked")
                  continue
              lower = text.lower()
              pos = lower.rfind("</footer>")
              if pos == -1:
                  skipped.append(f"{filename}: no footer")
                  continue
              text = text[:pos] + icon + text[pos:]
              path.write_text(text, encoding="utf-8")
              changed.append(filename)

          print("Changed:", changed)
          print("Skipped:", skipped)

      - name: Commit website changes
        run: |
          if git diff --quiet; then
            echo "No website changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Add LinkedIn icon to all website footers"
          git push
