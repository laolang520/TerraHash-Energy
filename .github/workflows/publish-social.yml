name: Publish announcements to social media

on:
  push:
    branches: [main]
    paths:
      - "announcements/*.json"
  workflow_dispatch:
    inputs:
      announcement_file:
        description: "Announcement JSON file to publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve announcement files
        id: files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES="${{ inputs.announcement_file }}"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            FILES="$(git diff --name-only "$BEFORE" "$AFTER" -- 'announcements/*.json' | tr '\n' ' ')"
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.files.outputs.files != ''
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION }}
        run: node scripts/publish-social.js ${{ steps.files.outputs.files }}
