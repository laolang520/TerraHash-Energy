name: Fix Ecosystem Contact Button Color

on:
  push:
    paths:
      - '.github/workflows/fix-ecosystem-contact-color.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match Contact Us button to site-wide styling
        shell: python
        run: |
          from pathlib import Path
          p=Path('ecosystem.html')
          s=p.read_text(encoding='utf-8')
          marker='</style></head>'
          css='.corp .header-actions .btn.primary{background:linear-gradient(180deg,#8bf153,#54c92c);border-color:#70e43c;color:#061506;box-shadow:0 8px 30px rgba(77,206,39,.15)}'
          if css not in s:
              s=s.replace(marker,css+marker,1)
              p.write_text(s,encoding='utf-8')
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ecosystem.html
          git commit -m "Fix Ecosystem Contact Us button color"
          git push
