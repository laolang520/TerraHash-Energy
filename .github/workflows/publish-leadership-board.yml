name: Publish Formal Leadership Board Page

on:
  push:
    paths:
      - '.github/workflows/publish-leadership-board.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build formal leadership page
        shell: python
        run: |
          from pathlib import Path
          src = Path('leadership-preview.html').read_text(encoding='utf-8')
          s = src
          s = s.replace('<meta name="robots" content="noindex,nofollow">', '')
          s = s.replace('<title>Leadership Preview | TerraHash Energy</title>', '<title>Leadership & Board of Directors | TerraHash Energy</title>')
          s = s.replace('<div class="preview">LEADERSHIP &amp; BOARD PAGE PREVIEW · NOT LINKED IN SITE NAVIGATION</div>', '')
          s = s.replace('This preview separates confirmed company personnel from board profiles whose TerraHash appointments and names remain pending confirmation.', 'Our leadership and Board of Directors bring experience across corporate management, infrastructure, technology, finance and long-term business development.')
          s = s.replace('Confirmed personnel are presented using the company roles and professional information currently provided for this preview.', 'Our executive leadership combines operational experience with a long-term approach to corporate development and responsible growth.')
          s = s.replace('BOARD PROFILE FRAMEWORK', 'BOARD OF DIRECTORS')
          s = s.replace('Detailed Director Profiles', 'Board of Directors')
          s = s.replace('The following biographies have been professionally structured from the information supplied for the preview. Names and TerraHash Energy appointments remain unconfirmed and therefore are not represented as finalized appointments.', 'The Board brings together experience across engineering, energy systems, technology, international business, finance, accounting and corporate governance.')
          s = s.replace('<span class="pending">PROFILE PENDING CONFIRMATION</span>', '')
          s = s.replace('PROPOSED PROFILE · 01', 'BOARD LEADERSHIP')
          s = s.replace('PROPOSED PROFILE · 02', 'INDEPENDENT DIRECTOR')
          s = s.replace('PROPOSED PROFILE · 03', 'INDEPENDENT DIRECTOR')
          s = s.replace('PROPOSED PROFILE · 04', 'INDEPENDENT DIRECTOR')
          s = s.replace('PROPOSED PROFILE · 05', 'INDEPENDENT DIRECTOR')
          names = ['Gu Cheng’an','Lu Jingchuan','Lin Zhiyuan','Michael Gu','Henry Shen']
          for name in names:
              s = s.replace('<h4>Name to be confirmed</h4>', f'<h4>{name}</h4>', 1)
          s = s.replace('Executive Director &amp; Chairman of the Board — appointment to be confirmed', 'Executive Director &amp; Chairman of the Board')
          s = s.replace('Independent Director &amp; Chair of Compensation Committee — appointment to be confirmed', 'Independent Director &amp; Chair of Compensation Committee')
          s = s.replace('Independent Director &amp; Chair of Corporate Governance and Nomination Committee — appointment to be confirmed', 'Independent Director &amp; Chair of Corporate Governance and Nomination Committee')
          s = s.replace('Independent Director — appointment to be confirmed', 'Independent Director')
          s = s.replace('Independent Director &amp; Chair of Audit Committee — appointment to be confirmed', 'Independent Director &amp; Chair of Audit Committee')
          s = s.replace('The supplied profile identifies the executive for the role of Chair of the Audit Committee, subject to confirmation of the relevant TerraHash Energy appointment.', 'His listed-company finance and audit experience supports his responsibilities as Chair of the Audit Committee.')
          start = s.find('<div class="notice"><strong style="color:#fff">Preview status:</strong>')
          if start != -1:
              end = s.find('</div>', start)
              if end != -1:
                  s = s[:start] + s[end+6:]
          Path('leadership.html').write_text(s, encoding='utf-8')
      - name: Commit formal page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leadership.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish formal Leadership and Board of Directors page"
          git push