name: Website Redesign Preview QA
on:
  push:
    branches:
      - redesign-preview-20261106
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated preview files and references
        shell: bash
        run: |
          node --check preview-v2/site.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          d=Path('preview-v2')
          pages=list(d.glob('*.html'))
          assert len(pages)>=16, f'expected 16 pages, got {len(pages)}'
          for p in pages:
              s=p.read_text()
              assert 'noindex,nofollow' in s, p
              assert 'site.js' in s and 'styles.css' in s, p
              assert 'data-page=' in s, p
          js=(d/'site.js').read_text()
          for name in ['home','company','solutions','development','technology','insights','leadership','history','governance','capital','careers','candidate','contact','role-coo','role-cdo','role-cgo']:
              assert (d/('index.html' if name=='home' else name+'.html')).is_file(), name
              assert 'views.'+name+'=' in js or name in ['role-coo','role-cdo','role-cgo'], name
          for path in re.findall(r'\.\./assets/([A-Za-z0-9._-]+)',js):
              assert (Path('assets')/path).exists(), 'missing asset '+path
          assert Path('preview-v2/README.md').exists()
          print('Preview static checks passed:',len(pages),'HTML files')
          PY
      - name: Render browser smoke test and screenshots
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/terrahash-preview.log 2>&1 &
          sleep 2
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3000 --dump-dom http://127.0.0.1:8765/preview-v2/index.html >/tmp/terrahash-rendered.html
          grep -q 'Energy infrastructure for a' /tmp/terrahash-rendered.html
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=3000 --window-size=1440,1000 --screenshot=/tmp/terrahash-desktop.png http://127.0.0.1:8765/preview-v2/index.html
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=3000 --window-size=420,900 --screenshot=/tmp/terrahash-mobile.png http://127.0.0.1:8765/preview-v2/index.html
          mkdir -p preview-screenshots
          cp /tmp/terrahash-desktop.png preview-screenshots/home-desktop.png
          cp /tmp/terrahash-mobile.png preview-screenshots/home-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: terrahash-redesign-preview-screenshots
          path: preview-screenshots/
